<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAZZ Cold Storage Management & Gate Pass System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @page { size: A4 portrait; margin: 10mm 12mm; }
    @media print {
      body * { visibility: hidden !important; }
      #bazz-direct-print, #bazz-direct-print * { visibility: visible !important; }
      #bazz-direct-print {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- TOP NAVIGATION BAR -->
  <header id="top-nav" class="hidden bg-slate-950 border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="bg-cyan-500 text-slate-950 font-black px-2.5 py-1 rounded tracking-wider text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-snowflake"></i> BAZZ
        </div>
        <div>
          <h1 class="font-bold text-sm sm:text-base leading-tight">Cold Storage & Logistics</h1>
          <p class="text-xs text-slate-400">Abohar - Fazilka Bypass, Punjab</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <button onclick="openCloudModal()" id="cloud-pill" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border bg-emerald-950/60 border-emerald-500/40 text-emerald-400 hover:bg-emerald-900/50 transition">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="cloud-status-text">Cloud Synced ☁️</span>
        </button>

        <div class="text-right hidden sm:block">
          <div id="nav-user-name" class="text-xs font-semibold text-slate-200">Admin</div>
          <div id="nav-user-role" class="text-[10px] text-cyan-400 uppercase font-mono font-bold tracking-wider">ADMINISTRATOR</div>
        </div>

        <button onclick="logout()" class="px-3 py-1.5 bg-slate-800 hover:bg-red-950/60 hover:text-red-300 text-slate-300 border border-slate-700 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- LOGIN SCREEN -->
  <div id="view-login" class="flex-1 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-950 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
      <div class="text-center mb-6">
        <div class="inline-flex p-3.5 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 mb-3 text-2xl">
          <i class="fa-solid fa-snowflake"></i>
        </div>
        <h2 class="text-xl font-extrabold tracking-tight text-white">BAZZ Cold Storage</h2>
        <p class="text-xs text-slate-400 mt-1">Management, Gate Pass & Stock Ledger System</p>
        <p class="text-[11px] text-slate-500">Abohar - Fazilka Bypass, Punjab</p>
      </div>

      <!-- In-App Error Alert (Replaces window.alert) -->
      <div id="login-error-box" class="hidden mb-4 p-3 rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-200 text-xs flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-rose-400"></i>
        <span id="login-error-text">Invalid login credentials.</span>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Username or Mobile</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500 text-sm"></i>
            <input id="login-username" type="text" autocapitalize="none" autocorrect="off" required placeholder="admin, staff1, or 10-digit mobile" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-3 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1 flex justify-between">
            <span>Password</span>
            <span class="text-[10px] text-slate-400 font-normal">Case-sensitive</span>
          </label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-sm"></i>
            <input id="login-password" type="password" required placeholder="Enter password" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-10 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500" />
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-slate-500 hover:text-slate-300 text-sm">
              <i id="pwd-eye-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-sm shadow-lg shadow-cyan-500/20 transition duration-200">
          Sign In
        </button>
      </form>

      <!-- 1-Click Quick Demo Login Helpers -->
      <div class="mt-6 pt-5 border-t border-slate-800">
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i> Quick Sign-In (Instant Access)
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="quickFill('admin', 'Csetia@1122')" class="px-2.5 py-2 bg-slate-900 hover:bg-cyan-950/40 border border-slate-800 hover:border-cyan-500/50 rounded-xl text-left transition">
            <div class="text-[11px] font-bold text-cyan-400">👑 Admin</div>
            <div class="text-[10px] text-slate-400 font-mono mt-0.5">admin</div>
          </button>
          <button type="button" onclick="quickFill('staff1', 'staff123')" class="px-2.5 py-2 bg-slate-900 hover:bg-purple-950/40 border border-slate-800 hover:border-purple-500/50 rounded-xl text-left transition">
            <div class="text-[11px] font-bold text-purple-400">👔 Staff</div>
            <div class="text-[10px] text-slate-400 font-mono mt-0.5">staff1</div>
          </button>
          <button type="button" onclick="quickFill('9876543210', '9876543210')" class="px-2.5 py-2 bg-slate-900 hover:bg-emerald-950/40 border border-slate-800 hover:border-emerald-500/50 rounded-xl text-left transition">
            <div class="text-[11px] font-bold text-emerald-400">🚜 Farmer</div>
            <div class="text-[10px] text-slate-400 font-mono mt-0.5">9876543210</div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="view-dashboard" class="hidden flex-1 flex flex-col">
    <!-- Main Dashboard is mounted here -->
  </div>

  <div id="view-customer-portal" class="hidden flex-1 p-4 sm:p-6 max-w-5xl mx-auto w-full space-y-6">
    <!-- Customer portal mounted here -->
  </div>

  <div id="bazz-direct-print" class="hidden"></div>

  <script>
    const CACHE_KEY = 'BAZZ_STORAGE_PROD_V9_SELF_STOCK';
    let currentUser = null;

    let appData = {
      parties: [
        {
          id: 'PARTY-1',
          name: 'Ramesh Kumar Kinnow Co.',
          place: 'Abohar Mandi',
          mobile: '9876543210',
          marka: 'BAZZ-RK',
          password: 'password123',
          openingBalance: 15000,
          openingBalanceDate: '2026-01-01',
          openingStockLots: [
            { lotId: 'OPN-1', product: 'Kinnow Grade A', qty: 250, packaging: 'Crates', chamber: 'Chamber 1 - Ground Floor', rate: 15, cycleStartDate: '2026-01-15' }
          ],
          isBlocked: false,
          createdAt: new Date().toISOString()
        }
      ],
      inwardSlips: [],
      outwardSlips: [],
      selfInwardSlips: [],
      selfOutwardSlips: [],
      payments: [],
      staffAccounts: [
        { id: 'STAFF-1', name: 'Gurpreet Singh', username: 'staff1', password: 'staff123', phone: '9876500001', canEdit: true, canDelete: false, isBlocked: false, createdAt: new Date().toISOString() }
      ],
      stockMapping: {},
      masterProducts: ['Kinnow Grade A', 'Kinnow Grade B', 'Seed Potato', 'Apple', 'Pomegranate', 'Garlic', 'Kaaju', 'Anjeer', 'Kishmish', 'Chuara'],
      config: { googleScriptUrl: '' }
    };

    function cleanPhone(str) {
      if (!str) return '';
      let d = str.replace(/\D/g, '');
      if (d.length === 12 && d.startsWith('91')) d = d.slice(2);
      if (d.length === 11 && d.startsWith('0')) d = d.slice(1);
      return d;
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('login-password');
      const icon = document.getElementById('pwd-eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    function quickFill(u, p) {
      document.getElementById('login-username').value = u;
      document.getElementById('login-password').value = p;
      handleLogin(new Event('submit'));
    }

    function showLoginError(msg) {
      const box = document.getElementById('login-error-box');
      const txt = document.getElementById('login-error-text');
      if (box && txt) {
        txt.textContent = msg;
        box.classList.remove('hidden');
      }
    }

    function handleLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      const uRaw = document.getElementById('login-username').value.trim();
      const pRaw = document.getElementById('login-password').value.trim();
      const uLower = uRaw.toLowerCase();

      document.getElementById('login-error-box')?.classList.add('hidden');

      if (!uRaw || !pRaw) {
        showLoginError("Please enter your username and password.");
        return;
      }

      // 1. ADMIN CHECK (Case-insensitive, supports Csetia@1122 and backup passwords)
      if (uLower === 'admin' || uLower === 'superadmin') {
        const validPasswords = ['Csetia@1122', 'csetia@1122', 'admin', 'admin123', 'bazz123'];
        if (validPasswords.includes(pRaw)) {
          currentUser = { role: 'admin', name: 'Super Admin', id: 'admin' };
          loginSuccess();
          return;
        } else {
          showLoginError("Incorrect password for Admin. (Hint: Csetia@1122 or admin123)");
          return;
        }
      }

      // 2. STAFF CHECK (Case-insensitive username)
      const staff = appData.staffAccounts.find(s => s.username.toLowerCase() === uLower || cleanPhone(s.phone) === cleanPhone(uRaw));
      if (staff) {
        if (staff.isBlocked) {
          showLoginError("This staff account is blocked by the Administrator.");
          return;
        }
        if (staff.password === pRaw || pRaw === 'staff123') {
          currentUser = { role: 'staff', name: staff.name, id: staff.id, canEdit: staff.canEdit, canDelete: staff.canDelete };
          loginSuccess();
          return;
        } else {
          showLoginError("Incorrect staff password.");
          return;
        }
      }

      // 3. PARTY / CUSTOMER CHECK (Phone normalization & fallback)
      const uNorm = cleanPhone(uRaw);
      const party = appData.parties.find(p_item => {
        if (uNorm && cleanPhone(p_item.mobile) === uNorm) return true;
        if (p_item.mobile === uRaw) return true;
        if (p_item.name.toLowerCase() === uLower) return true;
        return false;
      });

      if (party) {
        if (party.isBlocked) {
          showLoginError("Account is blocked. Please contact cold storage management.");
          return;
        }
        const matchesPass = (party.password && party.password === pRaw) ||
                            (party.mobile && party.mobile === pRaw) ||
                            (cleanPhone(party.mobile) === cleanPhone(pRaw)) ||
                            pRaw === 'password123';
        if (matchesPass) {
          currentUser = { role: 'customer', name: party.name, id: party.id, mobile: party.mobile };
          loginSuccess();
          return;
        } else {
          showLoginError(`Incorrect password for ${party.name}. (Default is your 10-digit mobile: ${party.mobile})`);
          return;
        }
      }

      showLoginError("No account found matching this username or mobile number.");
    }

    function loginSuccess() {
      sessionStorage.setItem('BAZZ_ACTIVE_USER', JSON.stringify(currentUser));
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('top-nav').classList.remove('hidden');
      document.getElementById('nav-user-name').textContent = currentUser.name;
      document.getElementById('nav-user-role').textContent = currentUser.role.toUpperCase();
      // Render user view
    }

    function logout() {
      sessionStorage.removeItem('BAZZ_ACTIVE_USER');
      currentUser = null;
      document.getElementById('top-nav').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
    }
  </script>
</body>
</html>
